{% extends "base.html" %}

{% block title %}Список товарів{% endblock %}

{% block content %}
<div class="container py-5">

    <h1 class="mb-4">Список товарів</h1>

    <div class="row g-4">

        {% for product in products %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">

                    <h5 class="card-title">
                        {{ product.name }}
                    </h5>

                    <p class="card-text">
                        {{ product.content }}
                    </p>

                    <p class="fw-bold mt-auto">
                        Ціна: ${{ product.price }}
                    </p>

                    <a href="{{ url_for('products.product_detail', product_id=product.id) }}"
                       class="btn btn-brown">
                        Детальніше
                    </a>

                </div>
            </div>
        </div>
        {% endfor %}

    </div>

</div>
{% endblock %}
