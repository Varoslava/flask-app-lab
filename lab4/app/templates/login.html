{% extends "base.html" %}

{% block title %}Вхід у систему{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h1 class="text-center mb-4">Вхід у систему</h1>

                <form method="POST" action="{{ url_for('users.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Логін</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-brown w-100">
                        Увійти
                    </button>
                </form>

                <p class="text-muted text-center mt-3 mb-0">
                    Навчальна авторизація Flask
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
