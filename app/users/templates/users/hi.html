{% extends "base.html" %}

{% block title %}Привітання{% endblock %}

{% block content %}

<div class="container py-5">

    <h1>Привіт, {{ name }}!</h1>

    {% if age %}
        <p>Вік: {{ age }}</p>
    {% else %}
        <p>Вік не вказано.</p>
    {% endif %}

    <hr>

    <h4>Меню користувачів</h4>

    <div class="d-flex flex-column gap-2 mt-3">

        <a href="{{ url_for('users.greetings', name='John', age=30) }}"
           class="btn btn-brown">
            John, 30 років
        </a>

        <a href="{{ url_for('users.greetings', name='John') }}"
           class="btn btn-outline-brown">
            John без віку
        </a>

        <a href="{{ url_for('users.admin') }}"
           class="btn btn-outline-brown">
            Адміністратор
        </a>

    </div>

</div>

{% endblock %}
